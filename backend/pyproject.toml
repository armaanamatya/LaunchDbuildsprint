[project]
name = "agent-graph-backend"
version = "0.1.0"
description = "FastAPI backend for the Agent Graph hackathon MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
    "claude-agent-sdk>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "anyio[trio]>=4.0.0",
    # Demo-repo's create_app imports Jinja2Templates at module load, so the
    # mock-strategy end-to-end tests need jinja2 in the backend test env.
    "jinja2>=3.1.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
anyio_mode = "asyncio"
